name: washtag-bd

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: washtag_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-washtag}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-washtag_secret}
      POSTGRES_DB: ${POSTGRES_DB:-washtagdb}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-washtag} -d ${POSTGRES_DB:-washtagdb}"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - washtag

  redis:
    image: redis:7-alpine
    container_name: washtag_redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks:
      - washtag

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: washtag_api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      # Redis is a best-effort cache; a broken Redis must not take the site down.
      redis:
        condition: service_started
    environment:
      ASPNETCORE_HTTP_PORTS: 8080
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=${POSTGRES_DB:-washtagdb};Username=${POSTGRES_USER:-washtag};Password=${POSTGRES_PASSWORD:-washtag_secret};SSL Mode=Disable;Trust Server Certificate=true
      ConnectionStrings__Redis: redis:6379
      JWT_SECRET: ${JWT_SECRET:-washtagbd-development-secret-change-this-in-production-2026}
      JWT_ISSUER: WashtagBD
      JWT_AUDIENCE: WashtagBDClient
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-true}
      MANUAL_PAYMENT_ENABLED: ${MANUAL_PAYMENT_ENABLED:-true}
      # The base file is the local demo profile. The production override sets this false.
      ALLOW_DEMO_IN_PRODUCTION: ${ALLOW_DEMO_IN_PRODUCTION:-true}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL:-text-embedding-3-small}
      OPENAI_CHAT_MODEL: ${OPENAI_CHAT_MODEL:-gpt-4o-mini}
      AI_GATEWAY_TOKEN: ${AI_GATEWAY_TOKEN:-}
      AI_GATEWAY_URL: ${AI_GATEWAY_URL:-https://ai.gateway.vercel.app/v1}
      AI_GATEWAY_EMBEDDING_MODEL: ${AI_GATEWAY_EMBEDDING_MODEL:-text-embedding-3-small}
      AI_GATEWAY_CHAT_MODEL: ${AI_GATEWAY_CHAT_MODEL:-gpt-4o-mini}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
      PAYMENT_WEBHOOK_SECRET: ${PAYMENT_WEBHOOK_SECRET:-}
      NOTIFICATION_WEBHOOK_URL: ${NOTIFICATION_WEBHOOK_URL:-}
      NOTIFICATION_WEBHOOK_TOKEN: ${NOTIFICATION_WEBHOOK_TOKEN:-}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:8081}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-demo@washtagbd.com}
      ENABLE_SWAGGER: ${ENABLE_SWAGGER:-false}
      MAINTENANCE_ENABLED: ${MAINTENANCE_ENABLED:-true}
      MAINTENANCE_INTERVAL_MINUTES: ${MAINTENANCE_INTERVAL_MINUTES:-60}
      MAINTENANCE_RUN_ON_STARTUP: ${MAINTENANCE_RUN_ON_STARTUP:-false}
      MAINTENANCE_CHAT_RETENTION_DAYS: ${MAINTENANCE_CHAT_RETENTION_DAYS:-90}
    expose:
      - "8080"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080; printf \"GET /health HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n\" >&3; head -1 <&3' | grep -q 200"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    networks:
      - washtag

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: washtag_web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      # Bind loopback by default so a TLS proxy must explicitly front the app.
      - "127.0.0.1:${APP_PORT:-8081}:80"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - washtag

volumes:
  pgdata:
  redisdata:

networks:
  washtag:
    driver: bridge
